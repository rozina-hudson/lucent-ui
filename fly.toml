# Fly.io deploy manifest for the Lucent MCP HTTP server.
# See docs/MCP_HOSTING.md for the full deploy + rotation flow.

app = "lucent-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  LUCENT_KEY_DB = "/data/keys.db"
  # LUCENT_API_KEY is still accepted as a legacy fallback during cutover;
  # unset via `fly secrets unset LUCENT_API_KEY` once a DB key is minted.

[[mounts]]
  source = "lucent_mcp_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
