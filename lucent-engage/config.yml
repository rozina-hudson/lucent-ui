queries:
  - "cursor \"design system\""
  - "cursor MCP"
  - "model context protocol devtools"
  - "design system AI"
  - "shadcn cursor"
  - "component library AI"
  - "storybook cursor"
  - "vibe coding design system"

product:
  name: Lucent UI
  tagline: AI-first React component library
  differentiator: >
    Every component ships with a COMPONENT_MANIFEST — a machine-readable
    spec that AI coding tools (Cursor, Copilot, Claude) read at import time.
    Define it once, every AI tool reads it natively. Like OpenAPI but for UI components.
  url: lucentui.com
  key_concept: COMPONENT_MANIFEST
  current_version: "0.10.0"
  features:
    - >
      30+ production atoms & molecules — Button, Input, Select, Checkbox, Radio,
      Toggle, Tag, Tooltip, Avatar, Badge, Spinner, Text, Icon, ColorSwatch,
      SegmentedControl, ColorPicker, FormField, SearchInput, Card, Alert,
      EmptyState, Skeleton, Breadcrumb, Tabs, Collapsible, NavLink, PageLayout,
      DataTable, CommandPalette, MultiSelect, DatePicker, DateRangePicker,
      FileUpload, Timeline
    - >
      Design Presets (v0.10) — pick a curated preset (modern, enterprise, playful)
      or mix dimensions (6 palettes × 3 shapes × 3 densities × 3 shadows).
      Full-atmosphere palettes tint bg/surface/border toward the accent hue.
    - >
      npx lucent-ui init — interactive CLI that walks through preset selection
      and writes lucent.config.ts + provider snippet
    - >
      MCP preset tools — list_presets discovers available presets;
      get_preset_config generates ready-to-use provider config
    - >
      Zero CSS-in-JS — inline styles + CSS custom properties only.
      Every component ships a COMPONENT_MANIFEST for AI coding tools.
    - >
      Bring-your-own-tokens via npx lucent-manifest init — fetches Figma Variables
      and generates a token override file
    - >
      Light/dark themes, accent color system with WCAG-compliant auto-contrast,
      brand token presets

voice:
  tone: Technical peer, not marketer. Lead with insight, not product.
  rules:
    - Never open with the product name
    - Lead with a genuine technical observation
    - Only mention Lucent UI if it's the natural next sentence
    - One out of three comments should have no product mention at all
    - Phrase "hallucinated variants" resonates with the audience
    - Phrase "like OpenAPI but for UI" is strong positioning

engagement_levels:
  additive: >
    Purely technical observation, no product mention.
    Use when the thread is adjacent but not directly on-point.
  forward: >
    Technical observation that hints at the problem space.
    Mention "we" or "we've been building" without naming the product.
    Use when the thread is directly relevant.
  direct: >
    Name COMPONENT_MANIFEST and lucentui.com explicitly.
    Use when the person has already articulated the exact pain point
    or when they're comparing solutions.

competitors:
  - name: shadcn/ui
    note: No manifest, no AI context layer. Not a direct competitor but often confused.
  - name: Storybook MCP
    note: >
      Closest adjacent tool. Key difference: Storybook is a human doc layer,
      COMPONENT_MANIFEST ships with the component at import time.
      Engage on Storybook threads — differentiation is clear and technical.
  - name: RantirSystem
    note: Direct competitor. Structured component library for AI. Research before engaging.
  - name: FlyonUI MCP
    note: Skip. Tailwind component tool, different audience.

skip_rules:
  - Decorative asset packs or design resources
  - Taste vs craft debates
  - Image generation / creative AI tools
  - Generic "AI is changing everything" takes
  - Posts by direct competitors (don't amplify them)
  - Anything where Lucent UI angle would feel forced
